name = "sillytavern"
version = "0.1.0"
protocol = 1
command = ["./sillytavern"]
capabilities = ["push", "pull"]
secrets = ["password"]

[config]
type = "object"
required = ["url", "auth"]

[config.properties.url]
type = "string"
title = "Server URL"
description = "The SillyTavern server, such as https://sillytavern.example.com"

[config.properties.auth]
type = "string"
title = "Login"
enum = ["none", "basic", "account"]
description = "none: the server asks for no login. basic: SillyTavern's basic auth (basicAuthMode). account: a SillyTavern user account (enableUserAccounts)."

[config.properties.username]
type = "string"
title = "Username"
description = "Required unless auth is none. The password is the instance's password secret."

[config.if.properties.auth]
enum = ["basic", "account"]

[config.then]
required = ["username"]
