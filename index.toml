# One [[plugin]] entry per plugin folder. Format: innkeeper core design spec,
# "Plugin repository".

[[plugin]]
name = "card-codec"
category = "Formats"
path = "card-codec"
version = "0.2.0"
protocol = 1
capabilities = ["codec"]
description = "Read and write character cards: CCv3, V2, and V1, as PNG and JSON. Also reads CharX."

[[plugin]]
name = "password-login"
category = "Login"
path = "password-login"
version = "0.2.0"
protocol = 1
capabilities = ["auth"]
description = "Log in as the owner with one password."

[[plugin]]
name = "card-import"
category = "Import"
path = "card-import"
version = "0.2.0"
protocol = 1
capabilities = ["import"]
description = "Import character cards and lorebooks from a folder or an uploaded file."

[[plugin]]
name = "lumiverse"
category = "Apps"
path = "lumiverse"
version = "0.1.0"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a Lumiverse server as characters and world books, and read them back."

[[plugin]]
name = "sillytavern"
category = "Apps"
path = "sillytavern"
version = "0.1.0"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a SillyTavern server as characters and world info files, and read them back."

[[plugin]]
name = "folder"
category = "Archives"
path = "folder"
version = "0.1.0"
protocol = 1
capabilities = ["catalog"]
description = "Search and adopt cards and lorebooks from a folder, without importing them all."
