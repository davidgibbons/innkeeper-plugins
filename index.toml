# One [[plugin]] entry per plugin folder. Format: innkeeper core design spec,
# "Plugin repository".

# The setup wizard shows these categories first, in this order.
categories = ["Apps", "Import", "Login"]

[[plugin]]
name = "card-codec"
category = "Formats"
path = "card-codec"
version = "0.2.0"
protocol = 1
capabilities = ["codec"]
description = "Read and write character cards: CCv3, V2, and V1, as PNG and JSON. Also reads CharX."

[[plugin]]
name = "password-login"
category = "Login"
path = "password-login"
version = "0.2.0"
protocol = 1
capabilities = ["auth"]
description = "Log in as the owner with one password."

[[plugin]]
name = "card-import"
category = "Import"
recommended = true
path = "card-import"
version = "0.2.1"
protocol = 1
capabilities = ["import"]
description = "Import character cards and lorebooks from a folder or an uploaded file."

[[plugin]]
name = "lumiverse"
category = "Apps"
recommended = true
path = "lumiverse"
version = "0.2.0"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a Lumiverse server as characters and world books, and read them back."

[[plugin]]
name = "sillytavern"
category = "Apps"
recommended = true
path = "sillytavern"
version = "0.2.0"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a SillyTavern server as characters and world info files, and read them back."

[[plugin]]
name = "folder"
category = "Archives"
path = "folder"
version = "0.1.0"
protocol = 1
capabilities = ["catalog"]
description = "Search and adopt cards and lorebooks from a folder, without importing them all."

[[plugin]]
name = "chub-archive"
category = "Archives"
path = "chub-archive"
version = "0.2.0"
protocol = 1
capabilities = ["catalog"]
description = "Search and adopt cards and lorebooks from the chub.ai archive's SQL dump."

[[plugin]]
name = "url-import"
category = "Import"
path = "url-import"
version = "0.3.0"
protocol = 1
capabilities = ["import", "sites", "pull"]
description = "Import a card or lorebook from its page URL on chub.ai, RisuRealm, or Character Tavern, link library items to their pages there, and check those pages for the author's changes. Needs a core with source_kinds."

[[plugin]]
name = "forge-ai"
category = "AI"
path = "forge-ai"
version = "0.4.0"
protocol = 1
capabilities = ["action", "records", "enrich"]
description = "Write, revise, tighten, and evaluate cards, write alternate greetings and lore entries, and score cards in bulk for the library grid, with a language model: OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, Ollama, llama.cpp, or any OpenAI-compatible server. Keeps Agent Skills the model can load. Needs a core with the action, records, and enrich capabilities."
