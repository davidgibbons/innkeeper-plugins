name = "forge-ai"
version = "0.4.0"
protocol = 1
command = ["./forge-ai"]
capabilities = ["action", "records", "enrich"]
secrets = ["api_key"]
database = true

[config]
type = "object"
required = ["provider", "model"]

[config.properties.provider]
type = "string"
title = "Provider"
enum = ["openai-compatible", "openai", "anthropic", "gemini", "mistral", "groq", "deepseek", "ollama", "llamacpp", "llamafile"]
description = "openai-compatible covers vLLM, llama.cpp servers, LM Studio, and OpenRouter. The API key is optional for it and for ollama, llamacpp, and llamafile."

[config.properties.base_url]
type = "string"
title = "Base URL"
description = "The API's URL, such as http://localhost:1234/v1. Required for openai-compatible; for other providers it overrides the default."

[config.properties.model]
type = "string"
title = "Model"

[config.properties.temperature]
type = "number"
title = "Temperature"
description = "Leave empty to use each action's own."

[config.properties.max_tokens]
type = "integer"
title = "Max tokens"
description = "Leave empty to use each action's own: 8192 for whole-card actions, 4096 for the rest."

[config.properties.house_style]
type = "string"
title = "House style"
description = "Added to every action's system prompt, such as \"British spelling; no em dashes\"."

[config.properties.additions]
type = "object"
title = "Additions"
description = "Added to one action's system prompt."

[config.properties.additions.properties]
generate = { type = "string", title = "Forge" }
revise = { type = "string", title = "Reforge" }
evaluate = { type = "string", title = "Evaluate" }
tighten-card = { type = "string", title = "Tighten card" }
change-pov = { type = "string", title = "Change point of view" }
tighten = { type = "string", title = "Tighten" }
expand = { type = "string", title = "Expand" }
to-prose = { type = "string", title = "Convert to prose" }
rewrite = { type = "string", title = "Rewrite" }
examples = { type = "string", title = "Write examples" }
alternate-greetings = { type = "string", title = "Write alternate greetings" }
lore-entries = { type = "string", title = "Write lore entries" }

[enrichments]
quality = { type = "score", range = [0, 100], label = "Quality", grid = true }
consistency = { type = "score", range = [0, 100], label = "Consistency" }
voice = { type = "score", range = [0, 100], label = "Voice" }
first_impression = { type = "score", range = [0, 100], label = "First impression" }
roleplayability = { type = "score", range = [0, 100], label = "Roleplayability" }
token_efficiency = { type = "score", range = [0, 100], label = "Token efficiency" }
field_governance = { type = "score", range = [0, 100], label = "Field governance" }

[records.skill]
label = "Skills"
import = ["file", "url"]

[records.skill.schema]
type = "object"
required = ["name", "description", "body"]
properties.name = { type = "string", title = "Name", description = "1 to 64 lowercase letters, digits, and single hyphens." }
properties.description = { type = "string", title = "Description", description = "What the skill does and when to use it. The model reads this to decide whether to load it." }
properties.body = { type = "string", title = "Instructions", contentMediaType = "text/markdown" }
properties.enabled = { type = "boolean", title = "Enabled", description = "Offer this skill to the model. New and imported skills start enabled.", default = true }
properties.files = { type = "object", title = "Reference files", description = "Text files the model can load, by path, such as {\"references/campus.md\": \"…\"}.", additionalProperties = { type = "string" } }
