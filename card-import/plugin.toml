name = "card-import"
version = "0.2.1"
protocol = 1
command = ["./card-import"]
capabilities = ["import"]
inputs = ["file"]

[config]
type = "object"

[config.properties.folder]
type = "string"
title = "Folder"
description = "Absolute path of the folder imports may read, as the core sees it, such as /import. Leave empty to import only uploads."
